name: Publish to the Chrome Web Store

# Every merge to main that changes the extension is released: the build is uploaded and
# submitted for review, and the store publishes it by itself when the review passes.
#
# The version is chosen here, not committed: one patch above the newest version the store
# has. For a minor or major release, set that version in chrome-extension/package.json (and
# package.json); it is used as it is while it is ahead of the store. Each release is tagged
# v<version>. A build that is still in review is withdrawn and replaced by the new one.
#
# Nothing is released for changes to workflows or Markdown only, or when the merged
# commit's message contains [skip release].
#
# There are no secrets. Google trusts this repository's main branch (workload identity
# federation, project jobjourney-extension) to act as a service account, and that service
# account is the one the store's developer dashboard lists under Publisher > Settings.
#
# Needs one repository variable, CWS_PUBLISHER_ID (same page). Without it nothing runs.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  # To push the release tag.
  contents: write
  id-token: write

env:
  ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/ehphmfcbcohognocpopclafhildkiedd
  CWS_API: https://chromewebstore.googleapis.com/v2
  CWS_UPLOAD_API: https://chromewebstore.googleapis.com/upload/v2

# Named, so a failing curl fails the step even when its output is piped (pipefail).
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "vars.CWS_PUBLISHER_ID != '' && !contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/303950999386/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: cws-publisher@jobjourney-extension.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Choose the version
        id: version
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          ours=$(jq -r .version chrome-extension/package.json)
          status=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$CWS_API/$ITEM:fetchStatus")
          # The newest version the store knows: published, or submitted and in review.
          theirs=$(echo "$status" | jq -r '
            [.publishedItemRevisionStatus, .submittedItemRevisionStatus]
            | map(.distributionChannels // [] | .[].crxVersion) | .[]' | sort -V | tail -n 1)
          theirs=${theirs:-0.0.0}
          newest=$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -n 1)
          if [ "$ours" != "$theirs" ] && [ "$newest" = "$ours" ]; then
            next=$ours
          else
            IFS=. read -r major minor patch <<< "$theirs"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "chrome-extension/package.json: $ours, store: $theirs, releasing: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "in_review=$(echo "$status" | jq -r '.submittedItemRevisionStatus.state // ""')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Build the production zip
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          for file in package.json chrome-extension/package.json; do
            jq --arg version "$VERSION" '.version = $version' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          pnpm install --frozen-lockfile --prefer-offline
          [ -f .env ] || cp .example.env .env
          pnpm manifest:prod
          pnpm zip
          ls -l dist-zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.next }}
          path: dist-zip/*.zip

      - name: Upload and submit for review
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION: ${{ steps.version.outputs.next }}
          IN_REVIEW: ${{ steps.version.outputs.in_review }}
        run: |
          zip=$(ls dist-zip/*.zip | head -n 1)

          # The store takes no new package while one is in review.
          if [ "$IN_REVIEW" = "PENDING_REVIEW" ]; then
            echo "Withdrawing the build that is in review."
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d '{}' "$CWS_API/$ITEM:cancelSubmission"
          fi

          uploaded=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
            -T "$zip" "$CWS_UPLOAD_API/$ITEM:upload")
          echo "$uploaded" | jq '{uploadState, crxVersion}'
          state=$(echo "$uploaded" | jq -r .uploadState)

          # A large package is processed after the request returns.
          for _ in $(seq 1 30); do
            [[ "$state" == *IN_PROGRESS* ]] || break
            sleep 10
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$CWS_API/$ITEM:fetchStatus" \
              | jq -r .lastAsyncUploadState)
            echo "upload: $state"
          done
          if [[ "$state" != *SUCCE* ]]; then
            echo "::error::The store did not accept the package: $state"
            exit 1
          fi

          published=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{}' "$CWS_API/$ITEM:publish")
          echo "$published" | jq '{state, warningInfo}'
          echo "::notice::Version $VERSION is submitted for review."

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
